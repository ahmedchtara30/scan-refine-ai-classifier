<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>ScanRefine | History</title>
</head>
<body class="container py-5">
    <h1>Scan History</h1>
    <a href="/" class="btn btn-secondary mb-3">Back to Scanner</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Confidence</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td>{{ row.label }}</td>
                <td>{{ row.category }}</td>
                <td>{{ row.confidence * 100 }}%</td>
                <td>{{ row.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanRefine | AI Waste Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { max-width: 700px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #preview-image { max-width: 100%; border-radius: 12px; display: none; margin: 20px 0; border: 2px solid #e9ecef; }
        .status-badge { font-size: 1.1rem; padding: 8px 16px; border-radius: 50px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">♻️ ScanRefine</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">Scanner</a>
                <a class="nav-link" href="/history">View History</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="main-card text-center">
            <h1 class="fw-bold text-success mb-3">Identify Your Waste</h1>
            <p class="text-muted mb-4">Upload a clear photo of an item to determine its recyclability.</p>

            <div class="mb-4">
                <input type="file" id="file-input" class="form-control" accept="image/*">
            </div>

            <img id="preview-image" src="#" alt="Preview">

            <button id="analyze-btn" class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm" disabled>
                Analyze with ScanRefine
            </button>

            <div id="result-section" class="mt-5 p-4 border rounded-3 bg-light" style="display: none;">
                <h2 id="res-label" class="text-capitalize fw-bold"></h2>
                <div id="res-category" class="status-badge d-inline-block my-3"></div>
                <div class="mt-3">
                    <small class="text-muted d-block mb-1">AI Confidence Score</small>
                    <div class="progress" style="height: 25px;">
                        <div id="res-conf-bar" class="progress-bar bg-info progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%">
                            <span id="res-conf-text">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-image');
        const analyzeBtn = document.getElementById('analyze-btn');
        const resultSection = document.getElementById('result-section');

        // Show preview when file is selected
        fileInput.onchange = function() {
            const [file] = fileInput.files;
            if (file) {
                previewImg.src = URL.createObjectURL(file);
                previewImg.style.display = 'block';
                analyzeBtn.disabled = false;
                resultSection.style.display = 'none'; // Hide old results
            }
        };

        // Handle the API call to Flask
        analyzeBtn.onclick = async function() {
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            analyzeBtn.innerText = "Processing Image...";
            analyzeBtn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                // Display the results
                resultSection.style.display = 'block';
                document.getElementById('res-label').innerText = data.label;
                document.getElementById('res-category').innerText = data.category;

                // Color coding based on category
                const badge = document.getElementById('res-category');
                badge.className = data.category === "Recyclable" ? "status-badge bg-success text-white" : "status-badge bg-warning text-dark";

                // Update Confidence Bar
                document.getElementById('res-conf-bar').style.width = data.confidence;
                document.getElementById('res-conf-text').innerText = data.confidence;

            } catch (error) {
                alert("ScanRefine Error: Could not connect to the backend server.");
            } finally {
                analyzeBtn.innerText = "Analyze with ScanRefine";
                analyzeBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
